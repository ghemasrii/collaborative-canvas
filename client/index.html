<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excalidraw Collab Canvas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body class="dark-theme">
  <div id="app">
    <!-- Top Floating Toolbar -->
    <div class="top-toolbar-container">
      <div class="brand-pill glass">
        <span class="brand-logo">✏️</span>
        <span class="brand-name">Excalidraw</span>
      </div>

      <nav class="main-toolbar glass">
        <!-- Lock Tool Mode Toggle -->
        <button id="lock-tool-btn" class="tool-btn" title="Keep Tool Selected (Lock)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </button>

        <div class="tool-divider"></div>

        <button class="tool-btn" data-tool="hand" title="Hand / Pan (H)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 11V6a2 2 0 0 0-4 0v5M14 10V4a2 2 0 0 0-4 0v6M10 10V2a2 2 0 0 0-4 0v11m4-1v-2"></path>
            <path d="M18 11a2 2 0 0 1 2 2v3a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"></path>
          </svg>
        </button>
        <button class="tool-btn" data-tool="select" title="Selection / Move (1 or V)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 3l7 18 3-7 7-3L3 3z"></path>
          </svg>
          <span class="hotkey-badge">1</span>
        </button>

        <button class="tool-btn" data-tool="rectangle" title="Rectangle (2 or R)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          </svg>
          <span class="hotkey-badge">2</span>
        </button>
        <button class="tool-btn" data-tool="diamond" title="Diamond (3 or D)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2L2 12l10 10 10-10L12 2z"></path>
          </svg>
          <span class="hotkey-badge">3</span>
        </button>
        <button class="tool-btn" data-tool="circle" title="Ellipse / Circle (4 or C)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
          </svg>
          <span class="hotkey-badge">4</span>
        </button>
        <button class="tool-btn" data-tool="arrow" title="Arrow (5 or A)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="19" x2="19" y2="5"></line>
            <polyline points="12 5 19 5 19 12"></polyline>
          </svg>
          <span class="hotkey-badge">5</span>
        </button>
        <button class="tool-btn" data-tool="line" title="Line (6 or L)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="19" x2="19" y2="5"></line>
          </svg>
          <span class="hotkey-badge">6</span>
        </button>

        <button class="tool-btn active" data-tool="brush" title="Pencil / Freehand (7 or B)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 11l-5-5L13 2H7L2 7v6l4 4 5 5h6v-6z"></path>
          </svg>
          <span class="hotkey-badge">7</span>
        </button>
        <button class="tool-btn" data-tool="text" title="Text (8 or T)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="4 7 4 4 20 4 20 7"></polyline>
            <line x1="9" y1="20" x2="15" y2="20"></line>
            <line x1="12" y1="4" x2="12" y2="20"></line>
          </svg>
          <span class="hotkey-badge">8</span>
        </button>
        <button id="image-tool-btn" class="tool-btn" data-tool="image" title="Insert Image / Clipart Sticker (9)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
          </svg>
          <span class="hotkey-badge">9</span>
        </button>
        <button class="tool-btn" data-tool="eraser" title="Eraser (0 or E)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"></path>
            <path d="M22 21H7"></path>
          </svg>
          <span class="hotkey-badge">0</span>
        </button>
        <button class="tool-btn" data-tool="sticky" title="Sticky Note (N)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15.5 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8.5L15.5 3z"></path>
            <polyline points="14 3 14 8 20 8"></polyline>
          </svg>
        </button>
      </nav>

      <!-- Room & User Controls -->
      <div class="user-pill glass">
        <div class="room-selector">
          <input type="text" id="room-input" value="default" placeholder="Room name" />
          <button id="join-room-btn" class="icon-btn" title="Join Room">➡️</button>
          <button id="share-room-btn" class="icon-btn" title="Copy Share Link">🔗</button>
        </div>
        <div id="online-users-list" class="avatars-group"></div>
      </div>
    </div>

    <!-- Left Style & Properties Panel -->
    <aside class="sidebar-properties glass">
      <div class="prop-section">
        <label class="prop-title">Theme</label>
        <div class="segmented-control theme-switcher">
          <button class="segment-btn" data-theme-mode="light" title="Light Theme">☀️ Light</button>
          <button class="segment-btn active" data-theme-mode="dark" title="Dark Theme">🌙 Dark</button>
          <button class="segment-btn" data-theme-mode="system" title="System Theme">💻 Auto</button>
        </div>
      </div>

      <div class="prop-section">
        <label class="prop-title">Canvas background</label>
        <div class="color-palette canvas-bg-palette">
          <button class="canvas-bg-swatch" data-canvas-bg="#ffffff" style="background: #ffffff;" title="Pure White"></button>
          <button class="canvas-bg-swatch" data-canvas-bg="#f8fafc" style="background: #f8fafc;" title="Off White"></button>
          <button class="canvas-bg-swatch" data-canvas-bg="#edf2f7" style="background: #edf2f7;" title="Soft Blue"></button>
          <button class="canvas-bg-swatch" data-canvas-bg="#fefcbf" style="background: #fefcbf;" title="Warm Cream"></button>
          <button class="canvas-bg-swatch" data-canvas-bg="#fce7f3" style="background: #fce7f3;" title="Soft Pink"></button>
          <button class="canvas-bg-swatch active" data-canvas-bg="#121212" style="background: #121212;" title="Dark Canvas"></button>
          <input type="color" id="custom-canvas-bg-picker" value="#121212" title="Custom Canvas Background" />
        </div>
      </div>

      <div class="prop-divider"></div>

      <div class="prop-section">
        <label class="prop-title">Stroke Color</label>
        <div class="color-palette">
          <button class="color-swatch active" data-color="#f8fafc" style="background: #f8fafc;"></button>
          <button class="color-swatch" data-color="#e2e8f0" style="background: #e2e8f0;"></button>
          <button class="color-swatch" data-color="#ff4d4d" style="background: #ff4d4d;"></button>
          <button class="color-swatch" data-color="#22c55e" style="background: #22c55e;"></button>
          <button class="color-swatch" data-color="#3b82f6" style="background: #3b82f6;"></button>
          <button class="color-swatch" data-color="#a855f7" style="background: #a855f7;"></button>
          <button class="color-swatch" data-color="#eab308" style="background: #eab308;"></button>
          <input type="color" id="stroke-color-picker" value="#f8fafc" title="Custom Stroke Color" />
        </div>
      </div>

      <div class="prop-section">
        <label class="prop-title">Background Fill</label>
        <div class="color-palette">
          <button class="fill-swatch" data-fill="transparent" style="background: transparent; border: 1px dashed #64748b;" title="Transparent">🚫</button>
          <button class="fill-swatch active" data-fill="#3b82f6" style="background: #3b82f6;"></button>
          <button class="fill-swatch" data-fill="#ef4444" style="background: #ef4444;"></button>
          <button class="fill-swatch" data-fill="#10b981" style="background: #10b981;"></button>
          <button class="fill-swatch" data-fill="#f59e0b" style="background: #f59e0b;"></button>
          <button class="fill-swatch" data-fill="#a855f7" style="background: #a855f7;"></button>
          <input type="color" id="fill-color-picker" value="#3b82f6" title="Custom Fill Color" />
        </div>
      </div>

      <div class="prop-section">
        <label class="prop-title">Fill Style</label>
        <div class="segmented-control">
          <button class="segment-btn active" data-fill-style="solid">Solid</button>
          <button class="segment-btn" data-fill-style="hatch">Hatch</button>
          <button class="segment-btn" data-fill-style="cross-hatch">Cross</button>
          <button class="segment-btn" data-fill-style="none">None</button>
        </div>
      </div>

      <div class="prop-section">
        <label class="prop-title">Sloppiness (Hand-Drawn)</label>
        <div class="segmented-control">
          <button class="segment-btn" data-sloppiness="architect">Clean</button>
          <button class="segment-btn active" data-sloppiness="artist">Artist</button>
          <button class="segment-btn" data-sloppiness="cartoon">Cartoon</button>
        </div>
      </div>

      <div class="prop-section">
        <label class="prop-title">Stroke Style</label>
        <div class="segmented-control">
          <button class="segment-btn active" data-dash="solid">Solid</button>
          <button class="segment-btn" data-dash="dashed">Dashed</button>
          <button class="segment-btn" data-dash="dotted">Dotted</button>
        </div>
      </div>

      <div class="prop-section">
        <label class="prop-title">Stroke Width: <span id="stroke-width-val">3px</span></label>
        <input type="range" id="stroke-width-slider" min="1" max="30" value="3" />
      </div>

      <div class="sidebar-footer">
        <button id="undo-btn" class="action-btn" title="Undo (Ctrl+Z)">↺ Undo</button>
        <button id="redo-btn" class="action-btn" title="Redo (Ctrl+Y)">↻ Redo</button>
        <button id="clear-btn" class="action-btn danger" title="Clear Canvas">🗑 Clear</button>
        <button id="save-btn" class="action-btn success" title="Export PNG">💾 Export</button>
      </div>
    </aside>

    <!-- Bottom Left Viewport Zoom & Grid Controls -->
    <div class="bottom-controls glass">
      <button id="zoom-out-btn" class="zoom-btn" title="Zoom Out">-</button>
      <span id="zoom-val" class="zoom-val">100%</span>
      <button id="zoom-in-btn" class="zoom-btn" title="Zoom In">+</button>
      <button id="zoom-reset-btn" class="zoom-btn" title="Reset Canvas View (100%)">Reset View</button>

      <div class="control-divider"></div>

      <button id="grid-toggle-btn" class="zoom-btn" title="Toggle Grid (Dots/Mesh/None)">Grid: Dots</button>

      <div class="control-divider"></div>

      <span id="fps-display" class="metric-badge">60 FPS</span>
      <span id="ping-display" class="metric-badge">-- ms</span>
    </div>

    <!-- Floating Object Action Controls Bar -->
    <div id="object-actions-bar" class="object-actions-bar glass hidden">
      <button id="obj-duplicate-btn" class="obj-btn" title="Duplicate Object">📋</button>
      <button id="obj-delete-btn" class="obj-btn danger" title="Delete Object">🗑️</button>
    </div>

    <!-- Clipart / Sticker Library Modal -->
    <div id="clipart-modal" class="modal-overlay hidden">
      <div class="clipart-dialog glass">
        <div class="modal-header">
          <h2>Stickers & Clipart Library</h2>
          <button id="close-clipart-btn" class="modal-close-btn">&times;</button>
        </div>

        <div class="modal-body">
          <div class="upload-section">
            <label for="image-file-input" class="upload-btn">
              <span>📤 Load Your Own Image</span>
              <input type="file" id="image-file-input" accept="image/*" />
            </label>
          </div>

          <div class="search-box">
            <input type="text" id="clipart-search" placeholder="Find stickers..." />
          </div>

          <div id="clipart-grid" class="clipart-grid">
            <div class="clipart-card" data-emoji="⭐" data-name="star">
              <span class="clipart-emoji">⭐</span>
              <span class="clipart-label">Star</span>
            </div>
            <div class="clipart-card" data-emoji="🦉" data-name="owl">
              <span class="clipart-emoji">🦉</span>
              <span class="clipart-label">Owl</span>
            </div>
            <div class="clipart-card" data-emoji="🐄" data-name="cow">
              <span class="clipart-emoji">🐄</span>
              <span class="clipart-label">Cow</span>
            </div>
            <div class="clipart-card" data-emoji="🐧" data-name="penguin">
              <span class="clipart-emoji">🐧</span>
              <span class="clipart-label">Penguin</span>
            </div>
            <div class="clipart-card" data-emoji="🦓" data-name="zebra">
              <span class="clipart-emoji">🦓</span>
              <span class="clipart-label">Zebra</span>
            </div>
            <div class="clipart-card" data-emoji="🐶" data-name="dog">
              <span class="clipart-emoji">🐶</span>
              <span class="clipart-label">Dog</span>
            </div>
            <div class="clipart-card" data-emoji="🦁" data-name="lion">
              <span class="clipart-emoji">🦁</span>
              <span class="clipart-label">Lion</span>
            </div>
            <div class="clipart-card" data-emoji="🦚" data-name="peacock">
              <span class="clipart-emoji">🦚</span>
              <span class="clipart-label">Peacock</span>
            </div>
            <div class="clipart-card" data-emoji="🐆" data-name="leopard">
              <span class="clipart-emoji">🐆</span>
              <span class="clipart-label">Leopard</span>
            </div>
            <div class="clipart-card" data-emoji="🚀" data-name="rocket">
              <span class="clipart-emoji">🚀</span>
              <span class="clipart-label">Rocket</span>
            </div>
            <div class="clipart-card" data-emoji="💖" data-name="heart">
              <span class="clipart-emoji">💖</span>
              <span class="clipart-label">Heart</span>
            </div>
            <div class="clipart-card" data-emoji="👑" data-name="crown">
              <span class="clipart-emoji">👑</span>
              <span class="clipart-label">Crown</span>
            </div>
            <div class="clipart-card" data-emoji="🎯" data-name="target">
              <span class="clipart-emoji">🎯</span>
              <span class="clipart-label">Target</span>
            </div>
            <div class="clipart-card" data-emoji="💡" data-name="lightbulb">
              <span class="clipart-emoji">💡</span>
              <span class="clipart-label">Lightbulb</span>
            </div>
            <div class="clipart-card" data-emoji="🔥" data-name="fire">
              <span class="clipart-emoji">🔥</span>
              <span class="clipart-label">Fire</span>
            </div>
            <div class="clipart-card" data-emoji="✅" data-name="checkmark">
              <span class="clipart-emoji">✅</span>
              <span class="clipart-label">Checkmark</span>
            </div>
            <div class="clipart-card" data-emoji="⚠️" data-name="warning">
              <span class="clipart-emoji">⚠️</span>
              <span class="clipart-label">Warning</span>
            </div>
            <div class="clipart-card" data-emoji="😃" data-name="happy face">
              <span class="clipart-emoji">😃</span>
              <span class="clipart-label">Avatar 1</span>
            </div>
            <div class="clipart-card" data-emoji="😎" data-name="cool avatar">
              <span class="clipart-emoji">😎</span>
              <span class="clipart-label">Avatar 2</span>
            </div>
            <div class="clipart-card" data-emoji="🥳" data-name="party avatar">
              <span class="clipart-emoji">🥳</span>
              <span class="clipart-label">Avatar 3</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Infinite Canvas Container -->
    <main id="canvas-container" class="canvas-container">
      <canvas id="main-canvas"></canvas>
      <canvas id="overlay-canvas"></canvas>
      <div id="cursors-layer"></div>
    </main>
  </div>

  <script type="module" src="/dist/client/main.js"></script>
</body>
</html>
